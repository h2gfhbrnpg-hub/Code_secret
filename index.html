<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Code secret</title>
<style>
body{background:#111;color:white;font-family:Arial;text-align:center;padding-top:80px}
input{font-size:30px;padding:15px;width:220px;text-align:center;border-radius:12px}
button{font-size:20px;padding:15px 35px;margin-top:15px;border-radius:12px}
#result{font-size:50px;font-weight:bold;margin-top:40px}
</style>
</head>
<body>

<h1>🔐 CODE SECRET</h1>

<input id="code" type="tel" maxlength="4" placeholder="Code">

<br>

<button onclick="check()">VALIDER</button>

<div id="result"></div>

<script>

function check(){

  const saisie = document.getElementById("code").value.trim().toUpperCase();

  const reponses = {

    "1302": "THIB",

    "SARAH": "3816",

    "0902": "INGRID",

    "INGRID": "5294",

    "5294": "BRAVO !"

  };

  if(reponses[saisie]){

    document.getElementById("result").innerHTML = reponses[saisie];

  }else{

    document.getElementById("result").innerHTML = "❌ Réponse incorrecte";

  
  
</script>

</body>
</html>
